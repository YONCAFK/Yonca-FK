<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YONCA FK - Resmi Web Sitesi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">⚽ YONCA FK</div>
        <nav>
            <button onclick="showSection('players')">Oyuncular</button>
            <button onclick="showSection('standings')">Puan Durumu</button>
            <button id="adminNavBtn" onclick="openLoginModal()">Admin Girişi</button>
        </nav>
    </header>

    <main>
        <!-- OYUNCU KARTLARI BÖLÜMÜ -->
        <section id="playersSection" class="active-section">
            <h2>Kadro & Oyuncu Kartları</h2>
            <div id="playersGrid" class="players-grid">
                <p>Yükleniyor...</p>
            </div>
        </section>

        <!-- PUAN DURUMU BÖLÜMÜ -->
        <section id="standingsSection" class="hidden">
            <h2>Siteler Arası Puan Tablosu</h2>
            <table>
                <thead>
                    <tr>
                        <th>Sıra</th>
                        <th>Takım</th>
                        <th>O</th>
                        <th>G</th>
                        <th>B</th>
                        <th>M</th>
                        <th>P</th>
                    </tr>
                </thead>
                <tbody id="standingsBody">
                </tbody>
            </table>
        </section>

        <!-- ADMİN PANELİ -->
        <section id="adminPanel" class="hidden admin-box">
            <div class="admin-header">
                <h2>⚙️ Yönetim Paneli</h2>
                <button class="logout-btn" onclick="logoutAdmin()">Çıkış Yap</button>
            </div>

            <div class="admin-card">
                <h3>Yeni Oyuncu Ekle</h3>
                <form id="addPlayerForm">
                    <input type="text" id="pName" placeholder="Oyuncu Adı" required>
                    <select id="pPos">
                        <option value="KL">Kaleci (KL)</option>
                        <option value="STP">Stoper (STP)</option>
                        <option value="ORT">Orta Saha (ORT)</option>
                        <option value="KNT">Kanat (KNT)</option>
                        <option value="SNT">Santrafor (SNT)</option>
                    </select>
                    <input type="number" id="pNumber" placeholder="Forma No" required>
                    <input type="text" id="pValue" placeholder="Değeri (Örn: 500K €)" required>
                    <button type="submit">Oyuncuyu Ekle</button>
                </form>
            </div>

            <div class="admin-card">
                <h3>Oyuncu Ayarlarını Düzenle</h3>
                <div id="adminPlayersList"></div>
            </div>

            <div class="admin-card">
                <h3>Puan Tablosu Ekle / Güncelle</h3>
                <form id="addTeamForm">
                    <input type="text" id="tName" placeholder="Site / Takım Adı" required>
                    <input type="number" id="tPlayed" placeholder="Oynanan (O)" required>
                    <input type="number" id="tWin" placeholder="Galibiyet (G)" required>
                    <input type="number" id="tDraw" placeholder="Beraberlik (B)" required>
                    <input type="number" id="tLoss" placeholder="Mağlubiyet (M)" required>
                    <input type="number" id="tPoints" placeholder="Puan (P)" required>
                    <button type="submit">Tabloya Kaydet</button>
                </form>
                <div id="adminTeamsList"></div>
            </div>
        </section>
    </main>

    <!-- GİRİŞ PENCERESİ -->
    <div id="loginModal" class="modal hidden">
        <div class="modal-content">
            <span class="close" onclick="closeLoginModal()">&times;</span>
            <h3>Admin Girişi</h3>
            <form id="loginForm">
                <input type="email" id="adminEmail" placeholder="Admin E-posta" required>
                <input type="password" id="adminPassword" placeholder="Admin Şifre" required>
                <button type="submit">Giriş Yap</button>
            </form>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
